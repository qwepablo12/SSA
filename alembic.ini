[alembic]
script_location = migrations
prepend_sys_path = src

# Migrations are named `NNNN_short_description.py` so that `ls versions/` reads
# as a history. Alembic's default random-hash filenames sort meaninglessly.
file_template = %%(rev)s_%%(slug)s

# NOTE: sqlalchemy.url is deliberately absent. The URL is built from Settings in
# env.py, so the database password never sits in a committed file and never
# appears in Alembic's log output.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
