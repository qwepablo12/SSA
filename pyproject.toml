[project]
name = "ssa"
version = "0.1.0"
description = "Student Success Assistant — a data-driven academic companion"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

# Optional groups are NOT installed by default. The MVP image installs only the
# base dependencies; the ML stack does not enter the image until ML ships (ADR-011).
[project.optional-dependencies]
bot = ["aiogram>=3.15.0", "redis>=5.2.0"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]
ml = ["pandas>=2.2.0", "numpy>=2.1.0", "scikit-learn>=1.5.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
    "factory-boy>=3.3.0",
    "hypothesis>=6.119.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssa"]


# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez  <- forbids naive datetime construction
    "T20",       # no print()
    "SIM",       # simplify
    "TC",        # type-checking imports
    "RUF",
]
ignore = [
    "B008",  # function call in default arg — normal in FastAPI/dishka wiring
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "N999", "TC003"]
"tests/*" = ["S101"]
# SQLAlchemy's annotated-declarative style resolves every `Mapped[...]`
# annotation at class-creation time (`de_stringify_annotation`), so the types
# it references — stdlib and the `types.py` column aliases alike — must stay
# real imports. A TYPE_CHECKING-only import raises `MappedAnnotationError` at
# import time, not just a type-checker complaint.
"src/ssa/infrastructure/database/models/*.py" = ["TC001", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["ssa"]


# ---------------------------------------------------------------------------
# mypy — strict where it matters, lenient at the edges
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = []
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_untyped_defs = true
check_untyped_defs = true

# The dependency rule is worth nothing if the layers it protects are untyped.
# NOTE: `strict = true` is not a valid per-module override in mypy — the flags
# it implies have to be listed individually.
[[tool.mypy.overrides]]
module = ["ssa.domain.*", "ssa.application.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL instance",
]


# ---------------------------------------------------------------------------
# import-linter — the architecture, enforced (01_Architecture.md §3)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["ssa"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward only"
type = "layers"
layers = [
    "ssa.apps",
    "ssa.infrastructure",
    "ssa.application",
    "ssa.domain",
    "ssa.shared",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["ssa.domain"]
forbidden_modules = ["sqlalchemy", "alembic", "aiogram", "fastapi", "redis", "pandas", "asyncpg"]

[[tool.importlinter.contracts]]
name = "Application is framework-free and job-runtime-free"
type = "forbidden"
source_modules = ["ssa.application"]
forbidden_modules = ["sqlalchemy", "alembic", "aiogram", "fastapi", "asyncpg", "celery", "taskiq"]

[[tool.importlinter.contracts]]
name = "Bot never touches ORM models or plotting"
type = "forbidden"
source_modules = ["ssa.apps.bot"]
forbidden_modules = ["ssa.infrastructure.database.models", "matplotlib"]
